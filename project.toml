[_]
schema-version = "0.2"

[io.buildpacks]
builder = "paketobuildpacks/builder-jammy-full"
exclude = [
  ".env", ".env.*", ".git", "node_modules", "tests",
  ".claude", ".codex", ".agents", ".mcp.json", ".agentouch.yml",
  "AGENTS.md", "CLAUDE.md", "boost.json",
  "bootstrap/cache/*.php"
]

[[io.buildpacks.build.env]]
name = "BP_PHP_SERVER"
value = "nginx"

[[io.buildpacks.build.env]]
name = "BP_PHP_WEB_DIR"
value = "public"

[[io.buildpacks.build.env]]
name = "BP_PHP_ENABLE_HTTPS_REDIRECT"
value = "false"   # sau ALB thì tắt, ALB lo TLS